plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'org.owasp.dependencycheck' version '13.0.0'
}

ext {
	set('springCloudVersion', "2025.1.3")
	// GHSA-9xv2-5v5q-p794, GHSA-h3x4-894j-xpx5, GHSA-gcx9-497g-6cp6 fixed in 11.0.25;
	// remove once the Spring Boot BOM picks it up.
	set('tomcat.version', "11.0.25")
}

// `./gradlew dependencyCheckAggregate` scans every module's resolved dependencies in one pass —
// the plain (non-aggregate) task only this root project has, which has none of its own. An NVD
// API key (repo secret NVD_API_KEY, see .github/workflows/dependency-check.yml) makes the NVD
// data sync fast; without one the scan still runs, just much slower against the public feed.
dependencyCheck {
	nvd.apiKey = System.getenv('NVD_API_KEY')
	// CVSS 0-10; only fail the build on genuinely severe, unaddressed findings. Below this,
	// findings still show up in the HTML/JSON report as something to triage, not a hard gate.
	failBuildOnCVSS = 7
	formats = ['HTML', 'JSON']
}

subprojects {

	apply plugin: 'java'
	apply plugin: 'java-library'
	apply plugin: 'org.springframework.boot'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
	}

	repositories {
		mavenCentral()
	}

	dependencies {
		implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
		implementation platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")
		compileOnly platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
		annotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
		testImplementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'
		annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
	}

	test {
		useJUnitPlatform()
		maxHeapSize = "1024m"
	}

	bootRun {
		enabled = false
	}

	bootJar {
		enabled = false
	}

	bootBuildImage {
		enabled = false
	}
}

bootRun {
	enabled = false
}

bootJar {
	enabled = false
}

bootBuildImage {
	enabled = false
}