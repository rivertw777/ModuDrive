name: Dependency vulnerability scan

# Catches a newly-disclosed CVE in an already-pinned dependency, which a one-time version check
# can't — see issue #321. NVD_API_KEY is an optional repo secret; the scan still runs without it,
# just much slower against the NVD's unauthenticated rate limit.
on:
  pull_request:
    branches: [dev, prod]
  schedule:
    - cron: "0 0 * * 1" # every Monday, 00:00 UTC
  workflow_dispatch: {}

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run OWASP dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAggregate

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.html
          retention-days: 30
